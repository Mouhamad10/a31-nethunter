name: Build A31 NetHunter kernel (Atrocious base)

# Adds the NetHunter feature set to the user's OWN booting kernel (Atrocious 4.14 for A31),
# so the existing Android-16 GSI (which needs Atrocious's eBPF backport) keeps working.
# Toolchain: the proven zyc-clang-14, placed at the exact hardcoded clang-r383902 path
# that the Atrocious Makefile expects.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Atrocious kernel source"
        default: "https://github.com/SN-Abdullah-Al-Noman/SM-A315F"
      kernel_ref:
        description: "branch / tag / commit"
        default: "main"
      defconfig:
        description: "base defconfig (fallback if the running config is absent)"
        default: "a31_defconfig"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libelf-dev make \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 zip xz-utils lz4 cpio kmod zstd ca-certificates lld

      - name: Clone Atrocious kernel
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.kernel_ref }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel \
          || git clone --depth 1 "${{ github.event.inputs.kernel_repo }}" kernel
          ls kernel/arch/arm64/configs/ | head

      - name: Fetch proven toolchain (zyc-clang-14) and satisfy the hardcoded path
        run: |
          git clone --depth=1 https://github.com/karamdev1/zyc-clang-14-20260619.git "$HOME/zyc" || \
          git clone --depth=1 https://github.com/justkaram0/zyc-clang-14-20260619.git "$HOME/zyc"
          "$HOME/zyc/bin/clang" --version | head -1 || { echo "::error::zyc clang not runnable (LFS?)"; ls -l "$HOME/zyc/bin" | head; exit 1; }
          # Atrocious hardcodes ../toolchain/clang/host/linux-x86/clang-r383902 ; with O=out make
          # runs from kernel/out, so cover every base with a FULL clang install (not loose symlinks).
          for base in "$GITHUB_WORKSPACE/toolchain" "$GITHUB_WORKSPACE/kernel/toolchain" "$GITHUB_WORKSPACE/kernel/out/toolchain"; do
            d="$base/clang/host/linux-x86"; mkdir -p "$d"; ln -sfn "$HOME/zyc" "$d/clang-r383902"
          done
          ls -l "$GITHUB_WORKSPACE/kernel/toolchain/clang/host/linux-x86/clang-r383902/bin/clang"

      - name: Merge NetHunter fragment onto the running config
        working-directory: kernel
        run: |
          FRAG=../kit/kernel/a315f_nethunter_defconfig.fragment
          RUNCFG=../kit/kernel/atrocious_v6_running.config
          if [ -f "$RUNCFG" ]; then cp "$RUNCFG" arch/arm64/configs/a315f_nethunter_defconfig
          else cp "arch/arm64/configs/${{ github.event.inputs.defconfig }}" arch/arm64/configs/a315f_nethunter_defconfig; fi
          ./scripts/kconfig/merge_config.sh -m -O arch/arm64/configs \
            arch/arm64/configs/a315f_nethunter_defconfig "$FRAG" || cat "$FRAG" >> arch/arm64/configs/a315f_nethunter_defconfig
          echo "fragment merged ($(grep -c '^CONFIG_' "$FRAG") opts)"

      - name: Build Image.gz
        working-directory: kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64 KBUILD_BUILD_USER=Mouhamad10 KBUILD_BUILD_HOST=github
          export PATH="$HOME/zyc/bin:$PATH"
          # Give clang a REAL GNU aarch64 assembler/linker for the TARGET only (via -B): zyc's bare
          # 'as' is LLVM-based (rejects GNU '-EL'); the integrated assembler chokes on the 4.14 VDSO
          # macros. GNU aarch64 'as' handles both. Host tools keep the system x86 as (HOSTCC=gcc).
          mkdir -p "$HOME/crosbin"
          ln -sf "$(command -v aarch64-linux-gnu-as)" "$HOME/crosbin/as"
          ln -sf "$(command -v aarch64-linux-gnu-ld)" "$HOME/crosbin/ld"
          # clang-14 is stricter than the clang-11 Atrocious used; its new warnings + the kernel's
          # -Werror abort the build. -w (what the proven karam build uses) silences warnings.
          # -fno-builtin-stpcpy: clang-14 rewrites some strcpy() into stpcpy(), which the 4.14 kernel
          # does not provide -> "undefined reference to stpcpy" at the vmlinux link. This stops that.
          MK=(make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- "CC=clang -B$HOME/crosbin" "KCFLAGS=-w -fno-builtin-stpcpy" KCPPFLAGS=-w HOSTCC=gcc HOSTCXX=g++)
          "${MK[@]}" a315f_nethunter_defconfig
          # clang-14 trips the 4.14 -fstack-protector-strong probe (Atrocious used clang-11/r383902);
          # drop the strong stack protector so the compiler-check passes (fine for a test kernel).
          ./scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG -d CC_STACKPROTECTOR_REGULAR -e CC_STACKPROTECTOR_NONE 2>/dev/null || true
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config 2>/dev/null || true
          "${MK[@]}" olddefconfig
          "${MK[@]}" -j"$(nproc)" Image.gz 2>&1 | tee ../build.log | tail -45

      - name: Collect
        run: |
          mkdir -p out
          cp kernel/out/arch/arm64/boot/Image.gz out/ 2>/dev/null && echo "IMAGE OK: $(ls -lh out/Image.gz | awk '{print $5}')" || echo "Image.gz NOT produced"
          cp build.log out/ 2>/dev/null || true
          cp kernel/out/.config out/kernel.config 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: a31-nethunter-kernel
          path: out/*
