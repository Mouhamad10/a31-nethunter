name: Build A31 NetHunter kernel (Atrocious base)

# Adds the NetHunter feature set to the user's OWN booting kernel (Atrocious 4.14 for A31),
# so the existing Android-16 GSI (which needs Atrocious's eBPF backport) keeps working.
# Toolchain: the proven zyc-clang-14, placed at the exact hardcoded clang-r383902 path
# that the Atrocious Makefile expects.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Atrocious kernel source"
        default: "https://github.com/SN-Abdullah-Al-Noman/SM-A315F"
      kernel_ref:
        description: "branch / tag / commit"
        default: "main"
      defconfig:
        description: "base defconfig (fallback if the running config is absent)"
        default: "a31_defconfig"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libelf-dev make \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 zip xz-utils lz4 cpio kmod zstd ca-certificates lld

      - name: Clone Atrocious kernel
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.kernel_ref }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel \
          || git clone --depth 1 "${{ github.event.inputs.kernel_repo }}" kernel
          ls kernel/arch/arm64/configs/ | head
          echo "=== wifi driver sources present in tree? ==="
          ls -d kernel/net/mac80211 kernel/net/wireless 2>&1 || true
          ls -d kernel/drivers/net/wireless/realtek/rtl818x/rtl8187 2>&1 || true
          ls kernel/drivers/net/wireless/realtek 2>&1 || true
          ls kernel/drivers/net/wireless/ralink 2>&1 || true

      - name: Patch sdfat to accept vold's time_offset option (external SD card fix)
        working-directory: kernel
        run: |
          # Modern GSI vold mounts the external microSD with "time_offset=<min>"; this
          # old Samsung sdfat driver rejects unknown options with -EINVAL, so the card
          # is marked "unmountable". The patch registers time_offset and ignores it.
          test -f fs/sdfat/sdfat.c || { echo "::error::fs/sdfat/sdfat.c not found"; exit 1; }
          python3 ../kit/kernel/patch_sdfat.py fs/sdfat/sdfat.c
          grep -n 'case Opt_time_offset' fs/sdfat/sdfat.c

      - name: Integrate RTL8822BU (88x2bu) driver in-tree (TP-Link Archer T4U 2357:0115)
        working-directory: kernel
        run: |
          # RTL8822BU is NOT in the 4.14 tree. Pull morrownr/88x2bu (has the 2357:0115 id)
          # and wire it as an in-kernel driver so CONFIG_RTL8822BU=y builds it into the image.
          git clone --depth 1 https://github.com/morrownr/88x2bu-20210702.git /tmp/r8822 2>&1 | tail -2
          D=drivers/net/wireless/realtek/rtl8822bu
          rm -rf "$D"; mkdir -p "$D"; cp -a /tmp/r8822/. "$D"/; rm -rf "$D/.git"
          grep -q 'rtl8822bu/' drivers/net/wireless/realtek/Makefile || echo 'obj-$(CONFIG_RTL8822BU) += rtl8822bu/' >> drivers/net/wireless/realtek/Makefile
          grep -q 'rtl8822bu/Kconfig' drivers/net/wireless/realtek/Kconfig || printf '\nsource "drivers/net/wireless/realtek/rtl8822bu/Kconfig"\n' >> drivers/net/wireless/realtek/Kconfig
          echo "wired. $(grep -m1 'config ' $D/Kconfig)"
          grep -n '0x2357, 0x0115' "$D"/os_dep/linux/usb_intf.c | head -1 || echo "::warning::device id 2357:0115 not found in driver"
          # --- 4.14 source-compat patches for the driver ---
          # kernel 4.14 declares console_suspend_enabled as bool; driver redeclares it int.
          sed -i 's/extern[[:space:]]\+int[[:space:]]\+console_suspend_enabled;/extern bool console_suspend_enabled;/' "$D"/os_dep/linux/usb_intf.c
          grep -n 'console_suspend_enabled' "$D"/os_dep/linux/usb_intf.c | head -3

      - name: Fetch proven toolchain (zyc-clang-14) and satisfy the hardcoded path
        run: |
          git clone --depth=1 https://github.com/karamdev1/zyc-clang-14-20260619.git "$HOME/zyc" || \
          git clone --depth=1 https://github.com/justkaram0/zyc-clang-14-20260619.git "$HOME/zyc"
          "$HOME/zyc/bin/clang" --version | head -1 || { echo "::error::zyc clang not runnable (LFS?)"; ls -l "$HOME/zyc/bin" | head; exit 1; }
          # Atrocious hardcodes ../toolchain/clang/host/linux-x86/clang-r383902 ; with O=out make
          # runs from kernel/out, so cover every base with a FULL clang install (not loose symlinks).
          for base in "$GITHUB_WORKSPACE/toolchain" "$GITHUB_WORKSPACE/kernel/toolchain" "$GITHUB_WORKSPACE/kernel/out/toolchain"; do
            d="$base/clang/host/linux-x86"; mkdir -p "$d"; ln -sfn "$HOME/zyc" "$d/clang-r383902"
          done
          ls -l "$GITHUB_WORKSPACE/kernel/toolchain/clang/host/linux-x86/clang-r383902/bin/clang"

      - name: Seed base defconfig from the running config
        working-directory: kernel
        run: |
          FRAG=../kit/kernel/a315f_nethunter_defconfig.fragment
          RUNCFG=../kit/kernel/atrocious_v6_running.config
          if [ -f "$RUNCFG" ]; then cp "$RUNCFG" arch/arm64/configs/a315f_nethunter_defconfig
          else cp "arch/arm64/configs/${{ github.event.inputs.defconfig }}" arch/arm64/configs/a315f_nethunter_defconfig; fi
          # Append the NetHunter fragment DIRECTLY to the defconfig the build will read.
          # (The old merge_config.sh -m -O step wrote a .config that `make <name>_defconfig`
          #  never reads, so the fragment was silently dropped — that is why MAC80211/RTL8187
          #  were missing from the previously-built kernel.)
          printf '\n# ===== NetHunter fragment (appended) =====\n' >> arch/arm64/configs/a315f_nethunter_defconfig
          cat "$FRAG" >> arch/arm64/configs/a315f_nethunter_defconfig
          echo "appended fragment ($(grep -c '^CONFIG_' "$FRAG") opts) to defconfig"

      - name: Build Image.gz
        working-directory: kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64 KBUILD_BUILD_USER=MLxMM KBUILD_BUILD_HOST=MLxMM
          export PATH="$HOME/zyc/bin:$PATH"
          # Give clang a REAL GNU aarch64 assembler/linker for the TARGET only (via -B): zyc's bare
          # 'as' is LLVM-based (rejects GNU '-EL'); the integrated assembler chokes on the 4.14 VDSO
          # macros. GNU aarch64 'as' handles both. Host tools keep the system x86 as (HOSTCC=gcc).
          mkdir -p "$HOME/crosbin"
          ln -sf "$(command -v aarch64-linux-gnu-as)" "$HOME/crosbin/as"
          ln -sf "$(command -v aarch64-linux-gnu-ld)" "$HOME/crosbin/ld"
          # clang-14 is stricter than the clang-11 Atrocious used; its new warnings + the kernel's
          # -Werror abort the build. -w (what the proven karam build uses) silences warnings.
          # -fno-builtin-stpcpy: clang-14 rewrites some strcpy() into stpcpy(), which the 4.14 kernel
          # does not provide -> "undefined reference to stpcpy" at the vmlinux link. This stops that.
          MK=(make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- "CC=clang -B$HOME/crosbin" "KCFLAGS=-w -fno-builtin-stpcpy" KCPPFLAGS=-w HOSTCC=gcc HOSTCXX=g++)
          # Identity branding: kernel release reads 4.14.357-OpenOla, built by MLxMM@MLxMM
          grep -n '^KERNELVERSION' Makefile
          # only the DISPLAYED release; real LINUX_VERSION_CODE stays 4.14.186 so driver version checks are unchanged
          sed -i 's/^KERNELVERSION = .*/KERNELVERSION = 4.14.357$(EXTRAVERSION)/' Makefile
          grep -n '^KERNELVERSION' Makefile
          "${MK[@]}" a315f_nethunter_defconfig
          ./scripts/config --file out/.config --set-str LOCALVERSION "-OpenOla" -d LOCALVERSION_AUTO
          # clang-14 trips the 4.14 -fstack-protector-strong probe (Atrocious used clang-11/r383902);
          # drop the strong stack protector so the compiler-check passes (fine for a test kernel).
          ./scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG -d CC_STACKPROTECTOR_REGULAR -e CC_STACKPROTECTOR_NONE 2>/dev/null || true
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config 2>/dev/null || true
          # DETERMINISTIC guarantee: force-enable the wifi stack directly on the generated .config,
          # independent of defconfig line-ordering. olddefconfig then pulls in dependencies.
          ./scripts/config --file out/.config \
            -e WLAN -e CFG80211 -e CFG80211_WEXT -e MAC80211 -e MAC80211_MESH -e PACKET \
            -e WIRELESS_EXT -e WEXT_CORE -e WEXT_PRIV -e WEXT_PROC \
            -e WLAN_VENDOR_REALTEK -e RTL8187 -e EEPROM_93CX6 -e RTL8192CU -e RTL8XXXU -e RTL8XXXU_UNTESTED -e RTL8822BU \
            -e WLAN_VENDOR_ATH -e ATH9K -e ATH9K_HTC -e CARL9170 \
            -e WLAN_VENDOR_RALINK -e RT2X00 -e RT2800USB \
            -e WLAN_VENDOR_MEDIATEK -e MT7601U -e WLAN_VENDOR_ZYDAS -e ZD1211RW \
            -e BT -e BT_HCIBTUSB -e USB_HID -e HIDRAW \n            -e SYSVIPC -e POSIX_MQUEUE -e IPC_NS -e DEVTMPFS -e FHANDLE -e TMPFS_XATTR -e TMPFS_POSIX_ACL 2>/dev/null || true
          "${MK[@]}" olddefconfig
          for s in CONFIG_SYSVIPC=y CONFIG_IPC_NS=y CONFIG_POSIX_MQUEUE=y CONFIG_DEVTMPFS=y CONFIG_FHANDLE=y CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y; do grep -qx "$s" out/.config && echo "OneOS cfg ok: $s" || echo "::warning::OneOS cfg MISSING: $s"; done
          grep -E '^CONFIG_LOCALVERSION=' out/.config
          # ---- ASSERT the wifi stack actually made it into the final config ----
          echo "=== WIFI/80211 in FINAL out/.config ==="
          grep -E 'CONFIG_(MAC80211|CFG80211_WEXT|RTL8187|RTL8XXXU|RTL8822BU|RT2800USB|ATH9K_HTC|MT7601U|ZD1211RW|WLAN)=' out/.config | sort || true
          miss=""
          for s in CONFIG_MAC80211=y CONFIG_RTL8187=y CONFIG_CFG80211_WEXT=y CONFIG_RTL8822BU=y; do
            grep -qx "$s" out/.config || miss="$miss $s"
          done
          if [ -n "$miss" ]; then
            echo "::error::NetHunter wifi stack MISSING from final config:$miss"
            echo "--- diagnostics: is the driver source even in the tree? ---"
            ls net/mac80211/Kconfig 2>&1
            ls -d drivers/net/wireless/realtek/rtl818x/rtl8187 2>&1
            grep -n 'MAC80211\|RTL8187' net/mac80211/Kconfig drivers/net/wireless/realtek/rtl818x/Kconfig 2>&1 | head
            exit 1
          fi
          echo ">>> wifi stack present (MAC80211 + RTL8187 + CFG80211_WEXT) — building kernel <<<"
          "${MK[@]}" -j"$(nproc)" Image.gz 2>&1 | tee ../build.log | tail -45
          # the pipe above hides make's exit code — fail explicitly if the image was not produced
          test -s out/arch/arm64/boot/Image.gz || { grep -n -E 'error:|Error [0-9]|undefined reference' ../build.log | head -30; echo "::error::Image.gz was NOT built (compile failed — see build.log)"; exit 1; }

      - name: Collect
        run: |
          mkdir -p out
          cp kernel/out/arch/arm64/boot/Image.gz out/ 2>/dev/null && echo "IMAGE OK: $(ls -lh out/Image.gz | awk '{print $5}')" || echo "Image.gz NOT produced"
          cp build.log out/ 2>/dev/null || true
          cp kernel/out/.config out/kernel.config 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: a31-nethunter-kernel
          path: out/*
