name: Build A31 NetHunter kernel

# Manual: Actions -> "Build A31 NetHunter kernel" -> Run workflow.
# Clones the booting 4.14 "Atrocious" tree, merges the NetHunter defconfig fragment,
# and builds Image.gz with clang. First-attempt scaffold: expect to pin toolchain /
# fix a few symbols for a fully green build; the logs are the point.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "4.14 Atrocious kernel source"
        default: "https://github.com/SN-Abdullah-Al-Noman/SM-A315F"
      kernel_ref:
        description: "branch / tag / commit"
        default: "main"
      defconfig:
        description: "base defconfig in arch/arm64/configs"
        default: "a31_defconfig"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev make gcc libc6-dev \
            clang lld llvm python3 zip ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          clang --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          # The Atrocious kernel hardcodes clang-r383902 at ../toolchain/...; satisfy that path
          # with the system LLVM toolchain so the build uses a working compiler.
          TCBIN="$GITHUB_WORKSPACE/toolchain/clang/host/linux-x86/clang-r383902/bin"
          mkdir -p "$TCBIN"
          for t in clang clang++ clang-cpp ld.lld lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip llvm-dis llvm-as llvm-ranlib; do
            s=$(command -v "$t" 2>/dev/null) && ln -sf "$s" "$TCBIN/$t"
          done
          ls "$TCBIN"

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.kernel_ref }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel || \
          git clone --depth 1 "${{ github.event.inputs.kernel_repo }}" kernel
          ls kernel/arch/arm64/configs/ | head

      - name: Merge NetHunter fragment into defconfig
        working-directory: kernel
        run: |
          FRAG=../kit/kernel/a315f_nethunter_defconfig.fragment
          RUNCFG=../kit/kernel/atrocious_v6_running.config
          # Prefer the EXACT running kernel config as the base (proven to boot), else the tree defconfig.
          if [ -f "$RUNCFG" ]; then
            echo "using the running kernel config as base"
            cp "$RUNCFG" arch/arm64/configs/a315f_nethunter_defconfig
            BASE=arch/arm64/configs/a315f_nethunter_defconfig
          else
            BASE=arch/arm64/configs/${{ github.event.inputs.defconfig }}
            test -f "$BASE" || { echo "::error::base defconfig $BASE not found"; ls arch/arm64/configs; exit 1; }
            cp "$BASE" arch/arm64/configs/a315f_nethunter_defconfig
          fi
          ./scripts/kconfig/merge_config.sh -m -O arch/arm64/configs \
            arch/arm64/configs/a315f_nethunter_defconfig "$FRAG" || \
            cat "$FRAG" >> arch/arm64/configs/a315f_nethunter_defconfig
          echo "merged fragment ($(grep -c '^CONFIG_' "$FRAG") options) onto base"

      - name: Build Image.gz
        working-directory: kernel
        continue-on-error: true
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export KBUILD_BUILD_USER=Mouhamad10 KBUILD_BUILD_HOST=github
          # The kernel hardcodes a RELATIVE ../toolchain/.../clang-r383902 path; with O=out make
          # runs from kernel/out, so ../toolchain resolves to kernel/toolchain. Populate every
          # plausible location with symlinks to the system LLVM so that path is a working clang.
          for root in "$GITHUB_WORKSPACE/toolchain" "$GITHUB_WORKSPACE/kernel/toolchain" "$GITHUB_WORKSPACE/kernel/out/toolchain"; do
            b="$root/clang/host/linux-x86/clang-r383902/bin"; mkdir -p "$b"
            for t in clang clang++ clang-cpp ld.lld lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                     llvm-readelf llvm-strip llvm-as llvm-dis llvm-ranlib; do
              s=$(command -v "$t") && ln -sf "$s" "$b/$t"
            done
          done
          ls -l "$GITHUB_WORKSPACE/kernel/toolchain/clang/host/linux-x86/clang-r383902/bin/clang"
          MAKE="make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
          $MAKE a315f_nethunter_defconfig || $MAKE ${{ github.event.inputs.defconfig }}
          $MAKE -j$(nproc) Image.gz 2>&1 | tee ../build.log | tail -40

      - name: Collect output
        run: |
          mkdir -p out
          cp kernel/out/arch/arm64/boot/Image.gz out/ 2>/dev/null && echo "Image.gz built" || echo "Image.gz NOT produced - see build.log"
          cp build.log out/ 2>/dev/null || true
          cp kernel/out/.config out/kernel.config 2>/dev/null || true
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a31-nethunter-kernel
          path: out/*
